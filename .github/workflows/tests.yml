name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned research stack (without the UI and deep-learning packages)
        run: |
          grep -v -E "^(torch|streamlit|aiogram|apscheduler|plotly|kaleido|yfinance)==" requirements-lock.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Run the unit tests (no database or network needed)
        run: python -m pytest -q tests
